name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, test and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Um único build já inclui o typecheck estrito (tsconfig.strict.json);
      # os passos seguintes reutilizam dist/ para evitar compilações repetidas.
      - name: Build and strict typecheck
        run: npm run build

      # Glob explicito: `node --test <dir>` nao expande diretorio no Node 22.
      - name: Run tests
        run: node --test "dist/test/**/*.test.js"

      - name: Security scan
        run: node dist/scripts/security-check.js
